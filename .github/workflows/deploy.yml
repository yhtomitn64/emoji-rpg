name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 (full history) rather than the default shallow clone -
      # the changelog-touch check below needs github.event.before's commit to
      # actually be present locally to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Raised 2026-08-29 after a few commits landed without a CHANGELOG.md
      # entry in the same push - not "Unreleased must be non-empty" (that's
      # wrong: Unreleased is *supposed* to go empty once a version bump moves
      # its contents into a dated section, see CHANGELOG.md's own header),
      # just "if you touched code, you touched the changelog too."
      - name: Check CHANGELOG.md was updated alongside any code change
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against (new branch or force-push) - skipping."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          CHANGED_NON_DOCS=$(echo "$CHANGED" | grep -v '\.md$' || true)
          if [ -z "$CHANGED_NON_DOCS" ]; then
            echo "Only docs changed - no changelog entry required."
            exit 0
          fi
          if ! echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Non-doc files changed in this push but CHANGELOG.md wasn't touched. Add an entry under ## [Unreleased] before this can deploy."
            exit 1
          fi
          echo "CHANGELOG.md was updated in this push - OK."

      # Raised 2026-09-01: the check above only requires that CHANGELOG.md
      # was touched somewhere - it doesn't catch a push landing with real
      # content still sitting under ## [Unreleased] instead of bumped into
      # a dated ## [x.y.z] section, which is exactly the drift class from
      # the 0.7.2 postmortem (js/data/playerChangelog.js's footer reads
      # PLAYER_CHANGELOG[0], which never updates from an un-bumped
      # Unreleased block - see the repo's own versioning checklist).
      # Doesn't contradict the previous step's own comment about Unreleased
      # being *allowed* to go empty - this is the other half: for a push
      # that changed non-doc files, it must.
      - name: Check CHANGELOG.md's Unreleased section was bumped, not left pending
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against (new branch or force-push) - skipping."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          CHANGED_NON_DOCS=$(echo "$CHANGED" | grep -v '\.md$' || true)
          if [ -z "$CHANGED_NON_DOCS" ]; then
            echo "Only docs changed - no version bump required."
            exit 0
          fi
          UNRELEASED_BODY=$(awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)
          if [ -n "$(echo "$UNRELEASED_BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md's ## [Unreleased] section still has content, but this push changed non-doc files. Bump it into a new dated ## [x.y.z] section (and add the matching js/data/playerChangelog.js entry) before this can deploy."
            exit 1
          fi
          echo "## [Unreleased] is empty - version was bumped. OK."

      # Catches this mechanically rather than relying on anyone remembering:
      # the maintainer's local machine routes npm through a private registry
      # mirror on purpose (a real supply-chain safeguard for local dev), but
      # that means package-lock.json can end up with resolved URLs CI has no
      # access to - npm ci would still fail on that (a confusing auth error,
      # several steps later), this just fails fast with the actual fix.
      - name: Check package-lock.json wasn't resolved through a private registry
        run: |
          if grep -q "artifactory" package-lock.json; then
            echo "::error::package-lock.json contains a private-registry URL - it was generated against a local/internal mirror instead of the public npm registry. Run 'npm run relock' locally and commit the result."
            exit 1
          fi

      # Bumped from 20 to 22 2026-09-04: pinning wranglerVersion below to a
      # current release (4.127.1) surfaced that recent wrangler requires
      # Node >=22 - the unpinned "npx wrangler@latest" path never hit this
      # because it silently fell back to installing an older wrangler@4.x
      # that still worked on Node 20. Node 22 is also what local dev already
      # runs, so nothing else in this repo needed adjusting for the bump.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The project had zero dependencies until jsdom was added for DOM
      # testing (2026-08-28) - npm run test now needs node_modules to exist,
      # which nothing installed before. npm ci (not install) so CI fails
      # loudly if package-lock.json and package.json ever drift apart.
      - run: npm ci

      - run: npm run test

      - name: Stage deployable files
        run: |
          mkdir dist
          cp index.html robots.txt sitemap.xml ads.txt _headers dist/
          cp -r css dist/
          cp -r js dist/
          if [ -d assets ]; then cp -r assets dist/; fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned 2026-09-04: without this, the action tries `npx
          # wrangler@latest --version` first, which fails on current npm
          # (missing --yes) and falls back to an explicit `npm i wrangler@4`
          # install - harmless but wasted overhead every single run. Bump
          # this occasionally; there's no auto-update mechanism. Whatever
          # version this is pinned to must support the Node version above
          # (setup-node) - 4.127.1 needs Node >=22, which is why that step
          # was bumped from 20 in the same change.
          wranglerVersion: '4.127.1'
          # --branch is compared against the Pages project's own production-
          # branch setting (default "main" for a direct-upload project with
          # no Git connection) to decide production vs. preview deploy - it
          # does not need to match this repo's actual default branch name.
          command: pages deploy dist --project-name=emoji-rpg --branch=main
